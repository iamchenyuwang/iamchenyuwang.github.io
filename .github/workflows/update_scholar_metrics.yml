name: Update Google Scholar Metrics

on:
  schedule:
    - cron: '0 3 * * 1'  # every Monday at 03:00 UTC
  push:
    paths:
      - '.github/workflows/update_scholar_metrics.yml'
      - 'scripts/update_scholar_metrics.py'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update scholar metrics JSON
        run: python scripts/update_scholar_metrics.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh Google Scholar metrics"
          file_pattern: assets/data/scholar_metrics.json
